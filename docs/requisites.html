<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реквизиты — Абсолем ПроРост</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --bg-accent1: #FDF4EC;
            --bg-accent2: #F4F1FA;
            --text: #2A2F45;
            --heading: #1E2A5A;
            --muted: #6B6F86;
            --accent: #F28C28;
            --secondary: #8B6DB8;
            --card: rgba(255,255,255,0.8);
            --card-border: #E5E1F0;
            --radius: 16px;
            --shadow: 0 10px 30px -18px rgba(30,42,90,0.25);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 24px 56px;
            color: var(--text);
            line-height: 1.7;
            background:
                radial-gradient(1200px 600px at 100% -10%, var(--bg-accent1), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, var(--bg-accent2), transparent 55%),
                var(--bg);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            font-size: 26px;
            color: var(--heading);
            margin: 0 0 20px;
            line-height: 1.3;
            padding-bottom: 14px;
            position: relative;
        }
        h1::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            height: 3px; width: 64px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
        }
        p, li { font-size: 15px; }
        .note {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 16px 16px 44px;
            font-size: 14px;
            color: var(--muted);
            box-shadow: var(--shadow);
            position: relative;
            margin-bottom: 16px;
        }
        .note::before {
            content: "";
            position: absolute;
            left: 18px; top: 22px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 15px;
            vertical-align: top;
        }
        tr:last-child td { border-bottom: none; }
        td:first-child {
            font-weight: 600;
            width: 40%;
            color: var(--heading);
        }
        @media (max-width: 520px) {
            body { padding: 24px 18px 48px; }
            h1 { font-size: 22px; }
            .note { padding: 14px 14px 14px 40px; font-size: 13.5px; }
            td { padding: 12px; font-size: 14px; }
            td:first-child { width: 44%; }
        }
    </style>
</head>
<body>
    <h1>Реквизиты</h1>
    <p class="note">Поля заполняются заказчицей после консультации с юристом. Сейчас — плейсхолдеры.</p>
    <table>
        <tr><td>Наименование</td><td>ИП / ООО «…»</td></tr>
        <tr><td>ИНН</td><td>—</td></tr>
        <tr><td>ОГРН / ОГРНИП</td><td>—</td></tr>
        <tr><td>Юридический адрес</td><td>—</td></tr>
        <tr><td>Контактный e-mail</td><td>hello@example.com</td></tr>
        <tr><td>Телефон</td><td>—</td></tr>
    </table>
</body>
</html>
